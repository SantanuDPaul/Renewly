{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-3">Renew Subscription</h2>

        <p>
            Renew <strong>{{ subscription.service_name }}</strong>?
        </p>

        <p class="text-muted">
            Billing Cycle:
            <strong>{{ subscription.get_billing_cycle_display }}</strong>
        </p>

        <p class="text-muted">
            Current Renewal Date:
            <strong>{{ subscription.renewal_date|date:"d M Y" }}</strong>
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-success">
                Renew
            </button>

            <a href="{% url 'subscription_list' %}" class="btn btn-secondary">
                Go Back
            </a>
        </form>

    </div>
</div>

{% endblock %}
